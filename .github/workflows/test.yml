name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x86_64
          - os: ubuntu-22.04
            target: linux-x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Zulu JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"
          architecture: x64

      - name: Compile
        shell: bash
        run: |
          mkdir -p build/classes dist
          find src/main/java -type f -name '*.java' -print > build/sources.txt
          javac --release 17 -encoding UTF-8 -d build/classes @build/sources.txt
          jar --create --file dist/ncm-breaker.jar \
            --main-class com.ncmbreaker.Main -C build/classes .

      - name: Smoke test CLI entry point
        shell: bash
        run: java -jar dist/ncm-breaker.jar --help
